<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f9fc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="一款简洁、好玩的手机数独游戏" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <script src="theme.js"></script>
  <title>数独 · Sudoku</title>
</head>
<body class="sudoku-body">
  <main class="app-shell sudoku-shell">
    <nav class="game-navigation" aria-label="页面导航"><a href="index.html">← 返回游戏库</a><span class="nav-actions"><span class="save-status" id="saveStatus" role="status" aria-live="polite">自动保存已开启</span><button class="theme-toggle" data-theme-toggle type="button" aria-label="切换到夜间模式">☾</button></span></nav>
    <header class="topbar">
      <div>
        <p class="eyebrow">每日专注 · 解开一格</p>
        <h1>数独 <span>Sudoku</span></h1>
      </div>
      <button class="icon-button" id="newGameTop" aria-label="开始新游戏" title="新游戏">↻</button>
    </header>

    <section class="stats" aria-label="游戏状态">
      <div class="stat-card"><span>用时</span><strong id="timer">00:00</strong></div>
      <div class="stat-card"><span>错误</span><strong><b id="mistakes">0</b><em>次</em></strong></div>
      <div class="stat-card"><span>完成</span><strong><b id="progress">0</b><em>/ 81</em></strong></div>
    </section>

    <section class="game-card">
      <div class="board-wrap">
        <div class="board" id="board" role="grid" aria-label="数独棋盘"></div>
      </div>
      <p class="board-tip" id="boardTip"><span class="tip-dot"></span> 点击格子，再选择下方数字</p>
    </section>

    <section class="controls" aria-label="操作区">
      <div class="control-row">
        <button class="secondary-button" id="hintButton"><span>✦</span> 提示</button>
        <button class="secondary-button" id="notesButton"><span>✎</span> 笔记 <i id="notesState">关</i></button>
        <button class="secondary-button" id="eraseButton"><span>⌫</span> 擦除</button>
      </div>
      <div class="number-pad" id="numberPad" aria-label="数字键盘">
        <button data-number="1">1</button><button data-number="2">2</button><button data-number="3">3</button>
        <button data-number="4">4</button><button data-number="5">5</button><button data-number="6">6</button>
        <button data-number="7">7</button><button data-number="8">8</button><button data-number="9">9</button>
      </div>
      <button class="review-button" id="reviewErrorsButton"><span>✓</span> 查看错误 <i id="errorReviewState">点击后显示</i></button>
    </section>

    <button class="new-game-button" id="newGameButton"><span>＋</span> 开始新游戏</button>
    <footer>专注当下，每一格都算数</footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="sudoku-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
